name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
      DATABASE_URL: mysql://creator:ci-only@127.0.0.1:3306/creator_platform
      APP_ENV: staging
      APP_URL: http://localhost:3000
      APP_VERSION: ${{ github.sha }}
      SIGNUPS_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test worker runtime
        run: node -e "require('./apps/worker/dist/index.cjs'); setTimeout(() => process.exit(0), 250)"

      - name: Package staging release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash infra/deploy/package-release.sh "$GITHUB_SHA"

      - name: Upload staging release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: creator-platform-${{ github.sha }}
          path: creator-platform-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
