name: P0 template formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: p0-template-formatter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p0-generation-templates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format P0 template files
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/admin/templates/page.tsx \
            "apps/web/src/app/api/admin/templates/[id]/route.ts" \
            apps/web/src/app/api/admin/templates/route.ts \
            "apps/web/src/app/api/templates/[slug]/favorite/route.ts" \
            "apps/web/src/app/api/templates/[slug]/resolve/route.ts" \
            apps/web/src/app/api/templates/route.ts \
            "apps/web/src/app/app/[organizationSlug]/page.tsx" \
            "apps/web/src/app/app/[organizationSlug]/templates/[slug]/page.tsx" \
            "apps/web/src/app/app/[organizationSlug]/templates/page.tsx" \
            apps/web/src/components/admin/template-manager.tsx \
            apps/web/src/components/studio/generation-studio.tsx \
            apps/web/src/components/templates/template-composer.tsx \
            apps/web/src/components/templates/template-library.tsx \
            apps/web/src/lib/templates.ts \
            docs/generation-templates.md \
            packages/authz/test/permissions.test.ts \
            packages/db/prisma/seed.ts \
            packages/db/prisma/templates.ts \
            packages/validation/src/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format P0 templates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
