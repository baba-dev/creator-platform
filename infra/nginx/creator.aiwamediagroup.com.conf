limit_req_zone $binary_remote_addr zone=creator_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name creator.aiwamediagroup.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name creator.aiwamediagroup.com;

    # Staging uses the existing Cloudflare Origin Certificate provisioned on
    # the host. Keep these files root-managed and configure Cloudflare SSL/TLS
    # mode as Full (strict).
    ssl_certificate /etc/nginx/certs/pubkey.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.key;

    client_max_body_size 100m;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # BytePlus fetches a short-lived grant in the URL. Never write the request
    # target (including its query string) to Nginx access or error logs.
    location ^~ /api/provider-media/ {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=creator_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=creator_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
