name: Project Format Helper

on:
  push:
    branches:
      - feat/projects-workflow

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format project changes and print patch
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/api/generations/route.ts \
            'apps/web/src/app/api/projects/[projectId]/route.ts' \
            apps/web/src/app/api/projects/route.ts \
            'apps/web/src/app/app/[organizationSlug]/page.tsx' \
            'apps/web/src/app/app/[organizationSlug]/projects/[projectId]/page.tsx' \
            'apps/web/src/app/app/[organizationSlug]/projects/page.tsx' \
            apps/web/src/components/projects/project-manager.tsx \
            apps/web/src/components/studio/generation-studio.tsx \
            apps/web/src/lib/project-api.ts \
            packages/generation/src/index.ts \
            packages/generation/test/projects.test.ts \
            packages/organizations/src/index.ts \
            packages/organizations/test/projects.test.ts
          git diff --binary
