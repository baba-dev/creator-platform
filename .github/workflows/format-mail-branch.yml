name: Format Mail Branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/transactional-mail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write apps/web/src/lib/auth.ts apps/worker/src/index.ts packages/config/src/index.ts packages/mail/src/index.ts packages/mail/test/mail.test.ts packages/organizations/src/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-mail-files
          path: |
            apps/web/src/lib/auth.ts
            apps/worker/src/index.ts
            packages/config/src/index.ts
            packages/mail/src/index.ts
            packages/mail/test/mail.test.ts
            packages/organizations/src/index.ts
