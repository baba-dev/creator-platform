name: Format PR 38 reconciliation

on:
  push:
    branches:
      - feat/job-reconciliation-resolution
    paths:
      - ".github/workflows/format-pr38.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/job-reconciliation-resolution
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/generation/src/reconciliation.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/generation/src/reconciliation.ts
          git commit -m "style: format reconciliation replay guard"
          git push origin HEAD:feat/job-reconciliation-resolution
