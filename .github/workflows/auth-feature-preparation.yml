# Temporary feature-only formatting and typecheck helper. Delete before merge.
name: Auth feature preparation
on:
  push:
    branches: [feat/auth-connections-2]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
      DATABASE_URL: mysql://creator:ci-only@127.0.0.1:3306/creator_platform
      APP_ENV: staging
      APP_URL: http://localhost:3000
      SIGNUPS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write .
      - name: Commit formatted feature
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "style(auth): format final feature"
            git push origin HEAD:feat/auth-connections-2
          fi
      - run: pnpm db:generate
      - run: pnpm --filter @aiwa/web typecheck
