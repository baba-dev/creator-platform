name: PR95 formatter

on:
  push:
    branches:
      - hardening/text-workspaces-production

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/text-workspaces-production
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format PR files
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/api/brand-profiles/generate/route.ts' \
            'apps/web/src/app/api/chat/threads/[threadId]/messages/[messageId]/synthesize/route.ts' \
            'apps/web/src/app/api/chat/threads/[threadId]/messages/route.ts' \
            'apps/web/src/app/api/director/chat/route.ts' \
            'apps/web/src/app/api/scripts/[scriptId]/generate/route.ts' \
            'apps/web/src/app/api/scripts/[scriptId]/route.ts' \
            'apps/web/src/app/api/scripts/[scriptId]/synthesize-batch/route.ts' \
            'apps/web/src/app/api/scripts/[scriptId]/synthesize/route.ts' \
            'apps/web/src/app/api/story-plans/generate/route.ts' \
            'apps/web/src/components/studio/brand-story-workspace.tsx' \
            'apps/web/src/components/studio/character-chat-workspace.tsx' \
            'apps/web/src/components/studio/creative-director-workspace.tsx' \
            'apps/web/src/components/studio/scriptwriting-studio.tsx' \
            'apps/web/src/lib/audio-assembly.ts' \
            'apps/web/src/lib/idempotency.ts' \
            'apps/web/src/lib/text-feature-client.ts' \
            'apps/web/src/lib/text-feature-generation.ts' \
            'apps/worker/src/index.ts' \
            'apps/worker/src/reaper.ts' \
            'packages/generation/src/text.ts' \
            'packages/generation/test/text.test.ts' \
            'packages/validation/src/index.ts' \
            'packages/validation/test/text-contracts.test.ts'

      - name: Commit formatting and remove temporary workflow
        run: |
          rm -f .github/workflows/pr95-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: format text workspace hardening"
          git push origin HEAD:hardening/text-workspaces-production
