# Temporary feature-branch formatter. Removed before merge.
name: Auth feature preparation
on:
  push:
    branches: [feat/auth-connections-2]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Format feature changes
        run: pnpm exec prettier --write .
      - name: Commit formatted changes
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "style(auth): format connections feature"
            git push origin HEAD:feat/auth-connections-2
          fi
