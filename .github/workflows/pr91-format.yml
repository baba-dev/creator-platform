name: PR 91 formatter

on:
  push:
    branches:
      - feat/byteplus-seed-text-models

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/byteplus-seed-text-models

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install formatter dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Format PR 91 touched files
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/api/admin/models/[modelId]/route.ts' \
            'apps/web/src/app/api/personas/route.ts' \
            'apps/web/src/app/api/scripts/[scriptId]/synthesize-batch/route.ts' \
            'apps/web/src/components/admin/model-actions.tsx' \
            'apps/web/src/components/studio/character-chat-workspace.tsx' \
            'apps/web/src/components/studio/scriptwriting-studio.tsx' \
            'packages/credits/src/usage.ts' \
            'packages/credits/test/usage.test.ts' \
            'packages/db/prisma/seed.ts' \
            'packages/generation/src/speech-trial.ts' \
            'packages/generation/src/text.ts' \
            'packages/generation/test/text.test.ts' \
            'packages/validation/src/index.ts' \
            'packages/validation/test/text-contracts.test.ts'

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply repository prettier"
          git push origin HEAD:feat/byteplus-seed-text-models
