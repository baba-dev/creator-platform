name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: creator_platform
          MARIADB_USER: creator
          MARIADB_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s
          --health-retries=20
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
      DATABASE_URL: mysql://creator:ci-only@127.0.0.1:3306/creator_platform
      APP_ENV: staging
      APP_URL: http://localhost:3000
      APP_VERSION: ${{ github.sha }}
      SIGNUPS_ENABLED: "true"
      GENERATION_INTEGRATION_TEST: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations for integration tests
        run: pnpm --filter @aiwa/db migrate:deploy

      - name: Check deployment shell syntax
        run: |
          bash -n infra/deploy/bootstrap-server.sh
          bash -n infra/deploy/creator-deploy
          bash -n infra/deploy/creator-ops
          bash -n infra/deploy/package-release.sh

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test worker runtime
        run: |
          node -e "require('./apps/worker/dist/index.cjs'); setTimeout(() => process.exit(0), 250)"
          if node apps/worker/dist/byteplus-smoke.cjs >byteplus-smoke.log 2>&1; then
            echo "BytePlus smoke command unexpectedly ran without credentials" >&2
            exit 1
          fi
          grep -q '"status":"failed"' byteplus-smoke.log

      - name: Package and validate staging release
        run: bash infra/deploy/package-release.sh "$GITHUB_SHA"

      - name: Upload staging release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: creator-platform-${{ github.sha }}
          path: creator-platform-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
