name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push CI run ID to deploy (artifact must still exist)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: creator-platform-staging
  cancel-in-progress: false

jobs:
  release:
    name: Verify deployment source
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - name: Resolve successful main CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          source_file="$RUNNER_TEMP/deployment-source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" >"$source_file"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            .name == "CI" and .path == ".github/workflows/ci.yml" and
            .event == "push" and .head_branch == "main" and
            .head_repository.full_name == $repo and
            .status == "completed" and .conclusion == "success" and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' "$source_file" >/dev/null; then
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            echo "### Deployment not eligible" >>"$GITHUB_STEP_SUMMARY"
            echo "CI run $SOURCE_RUN_ID must be a successful main-branch push in this repository. Rerun failed CI first; rerunning deployment cannot change its CI result." >>"$GITHUB_STEP_SUMMARY"
            echo "::error::CI run $SOURCE_RUN_ID is not eligible for deployment."
            exit 1
          fi
          release_sha="$(jq -r '.head_sha' "$source_file")"
          echo "deploy=true" >>"$GITHUB_OUTPUT"
          echo "sha=$release_sha" >>"$GITHUB_OUTPUT"
          echo "run_id=$SOURCE_RUN_ID" >>"$GITHUB_OUTPUT"
          echo "Deploying validated release $release_sha from CI run $SOURCE_RUN_ID." >>"$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://creator.aiwamediagroup.com
    env:
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - name: Download CI release artifact
        id: ci_artifact
        uses: actions/download-artifact@v4
        with:
          name: creator-platform-${{ env.RELEASE_SHA }}
          run-id: ${{ needs.release.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify promoted CI artifact digest
        run: |
          set -Eeuo pipefail
          test -f "creator-platform-${RELEASE_SHA}.tar.gz"
          test -f "creator-platform-${RELEASE_SHA}.tar.gz.sha256"
          sha256sum --check --strict "creator-platform-${RELEASE_SHA}.tar.gz.sha256"

      - name: Validate release artifact structure
        run: |
          set -Eeuo pipefail
          archive="creator-platform-${RELEASE_SHA}.tar.gz"
          test -f "$archive"
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          # CI validates the full runtime. Extract only deployment metadata here;
          # the server validates the complete runtime again before activation.
          tar -xzf "$archive" -C "$validation_dir" \
            ./RELEASE_LAYOUT ./RELEASE_SHA ./ops/control-plane.sha256 \
            ./ops/bin ./ops/systemd
          test "$(cat "$validation_dir/RELEASE_LAYOUT")" = "3"
          test "$(cat "$validation_dir/RELEASE_SHA")" = "$RELEASE_SHA"
          (
            cd "$validation_dir"
            sha256sum --check --strict ops/control-plane.sha256
          )
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-web.service"
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-worker.service"
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-worker@.service"

      - name: Prepare verified staging SSH transport
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_FINGERPRINT: ${{ secrets.STAGING_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          umask 077

          key_file="$RUNNER_TEMP/staging-deploy-key"
          known_hosts="$RUNNER_TEMP/staging-known-hosts"
          printf '%s\n' "$STAGING_SSH_KEY" | tr -d '\r' >"$key_file"
          chmod 0600 "$key_file"

          scanned_hosts="$RUNNER_TEMP/staging-scanned-hosts"
          expected_fingerprint="$(
            printf '%s' "$STAGING_SSH_FINGERPRINT" | tr -d '\r\n'
          )"

          timeout 45 ssh-keyscan -4 -p "$STAGING_SSH_PORT" \
            -t ed25519,ecdsa,rsa \
            "$STAGING_SSH_HOST" >"$scanned_hosts" 2>/dev/null
          test -s "$scanned_hosts"

          : >"$known_hosts"
          while IFS= read -r host_key; do
            fingerprint="$(
              printf '%s\n' "$host_key" \
                | ssh-keygen -lf - -E sha256 2>/dev/null \
                | awk '{print $2}'
            )"
            if [ "$fingerprint" = "$expected_fingerprint" ]; then
              printf '%s\n' "$host_key" >>"$known_hosts"
            fi
          done <"$scanned_hosts"

          rm -f -- "$scanned_hosts"
          if ! test -s "$known_hosts"; then
            echo "No staging SSH host key matches the configured SHA-256 fingerprint." >&2
            exit 1
          fi

      - name: Verify hardened staging control plane and upload path
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )

          timeout 60 ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'set -eu
            version="$(sudo -n /usr/local/sbin/creator-deploy --version)"
            test "$version" = "3" || {
              echo "staging creator-deploy control plane must be bootstrapped to version 3" >&2
              exit 1
            }
            test -d /var/www/creator-platform/incoming
            test -w /var/www/creator-platform/incoming || {
              echo "deployment user cannot write /var/www/creator-platform/incoming" >&2
              stat -c "%U:%G %a %n" /var/www/creator-platform/incoming >&2 || true
              exit 1
            }
            df -Pk /var/www/creator-platform/incoming
          '

      - name: Upload and verify release on staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          archive="creator-platform-${RELEASE_SHA}.tar.gz"
          remote_dir="/var/www/creator-platform/incoming"
          remote_archive="$remote_dir/creator-platform-${RELEASE_SHA}.tar.gz"
          remote_partial="${remote_archive}.part"
          local_sha="$(sha256sum "$archive" | awk '{print $1}')"

          ssh_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )
          scp_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -P "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )

          timeout 60 ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "rm -f -- '$remote_partial'"

          timeout 300 scp "${scp_opts[@]}" "$archive" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$remote_partial"

          # Verify the partial upload before publishing the archive for activation.
          timeout 60 ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "set -eu
             test -f '$remote_partial'
             actual_sha=\$(sha256sum '$remote_partial' | cut -c1-64)
             if [ \"\$actual_sha\" != '$local_sha' ]; then
               rm -f -- '$remote_partial'
               echo 'Uploaded staging artifact failed SHA-256 verification.' >&2
               exit 1
             fi
             mv -f -- '$remote_partial' '$remote_archive'"

      - name: Activate release on staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )

          ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "sudo -n /usr/local/sbin/creator-deploy \
              '$RELEASE_SHA' \
              '/var/www/creator-platform/incoming/creator-platform-${RELEASE_SHA}.tar.gz'"

      - name: Record successful deployment
        run: |
          echo "### Staging deployed" >>"$GITHUB_STEP_SUMMARY"
          echo "Release: $RELEASE_SHA. The tested artifact is retained in its CI run; immutable server releases remain available for rollback." >>"$GITHUB_STEP_SUMMARY"

      - name: Clean up staging SSH material
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/staging-deploy-key" \
            "$RUNNER_TEMP/staging-known-hosts"
