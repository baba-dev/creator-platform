name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: creator-platform-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment:
      name: staging
      url: https://creator.aiwamediagroup.com
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      AUTH_SECRET: staging-build-only-auth-secret-at-least-32-characters-long
      DATABASE_URL: mysql://creator:staging-build-only@127.0.0.1:3306/creator_platform
      APP_ENV: staging
      APP_URL: https://creator.aiwamediagroup.com
      APP_VERSION: ${{ github.event.workflow_run.head_sha }}
      SIGNUPS_ENABLED: "true"
      GENERATION_INTEGRATION_TEST: "false"
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-1.1.x,debian-openssl-3.0.x
    steps:
      - name: Check out successful CI revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rebuild validated revision for staging
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          pnpm install --frozen-lockfile --prefer-offline
          pnpm db:generate
          pnpm build
          bash infra/deploy/package-release.sh "$RELEASE_SHA"

      - name: Validate rebuilt release artifact
        run: |
          set -Eeuo pipefail
          archive="creator-platform-${RELEASE_SHA}.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" >/dev/null
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          if command -v pigz >/dev/null 2>&1; then
            tar -I pigz -xf "$archive" -C "$validation_dir"
          else
            tar -xzf "$archive" -C "$validation_dir"
          fi
          test "$(cat "$validation_dir/RELEASE_LAYOUT")" = "3"
          (
            cd "$validation_dir"
            sha256sum --check --strict ops/control-plane.sha256
          )
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-web.service"
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-worker.service"
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-worker@.service"

      - name: Prepare verified staging SSH transport
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_FINGERPRINT: ${{ secrets.STAGING_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          umask 077

          key_file="$RUNNER_TEMP/staging-deploy-key"
          known_hosts="$RUNNER_TEMP/staging-known-hosts"
          printf '%s\n' "$STAGING_SSH_KEY" | tr -d '\r' >"$key_file"
          chmod 0600 "$key_file"

          scanned_hosts="$RUNNER_TEMP/staging-scanned-hosts"
          expected_fingerprint="$(
            printf '%s' "$STAGING_SSH_FINGERPRINT" | tr -d '\r\n'
          )"

          timeout 45 ssh-keyscan -4 -p "$STAGING_SSH_PORT" \
            -t ed25519,ecdsa,rsa \
            "$STAGING_SSH_HOST" >"$scanned_hosts" 2>/dev/null
          test -s "$scanned_hosts"

          : >"$known_hosts"
          while IFS= read -r host_key; do
            fingerprint="$(
              printf '%s\n' "$host_key" \
                | ssh-keygen -lf - -E sha256 2>/dev/null \
                | awk '{print $2}'
            )"
            if [ "$fingerprint" = "$expected_fingerprint" ]; then
              printf '%s\n' "$host_key" >>"$known_hosts"
            fi
          done <"$scanned_hosts"

          rm -f -- "$scanned_hosts"
          if ! test -s "$known_hosts"; then
            echo "No staging SSH host key matches the configured SHA-256 fingerprint." >&2
            exit 1
          fi

      - name: Verify hardened staging control plane and upload path
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )

          ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'set -eu
            version="$(sudo -n /usr/local/sbin/creator-deploy --version)"
            test "$version" = "3" || {
              echo "staging creator-deploy control plane must be bootstrapped to version 3" >&2
              exit 1
            }
            test -d /var/www/creator-platform/incoming
            test -w /var/www/creator-platform/incoming || {
              echo "deployment user cannot write /var/www/creator-platform/incoming" >&2
              stat -c "%U:%G %a %n" /var/www/creator-platform/incoming >&2 || true
              exit 1
            }
            df -Pk /var/www/creator-platform/incoming
          '

      - name: Upload and verify release on staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          archive="dist/creator-platform-${RELEASE_SHA}.tar.gz"
          remote_dir="/var/www/creator-platform/incoming"
          remote_archive="$remote_dir/creator-platform-${RELEASE_SHA}.tar.gz"
          remote_partial="${remote_archive}.part"
          local_sha="$(sha256sum "$archive" | awk '{print $1}')"

          ssh_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )
          scp_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -P "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )

          ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "rm -f -- '$remote_partial'"

          scp "${scp_opts[@]}" "$archive" \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST:$remote_partial"

          remote_sha="$(
            ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
              "set -eu
               test -f '$remote_partial'
               sha256sum '$remote_partial' | cut -c1-64
               mv -f -- '$remote_partial' '$remote_archive'"
          )"
          test "$remote_sha" = "$local_sha" || {
            echo "Uploaded staging artifact failed SHA-256 verification." >&2
            exit 1
          }

      - name: Activate release on staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(
            -4
            -i "$RUNNER_TEMP/staging-deploy-key"
            -p "$STAGING_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/staging-known-hosts"
          )

          ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "sudo -n /usr/local/sbin/creator-deploy \
              '$RELEASE_SHA' \
              '/var/www/creator-platform/incoming/creator-platform-${RELEASE_SHA}.tar.gz'"

      - name: Delete deployed staging artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          artifact_id="$(
            gh api               "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100"               --jq ".artifacts[] | select(.name == \"creator-platform-${RELEASE_SHA}\") | .id"               | head -n 1
          )"
          if test -n "$artifact_id"; then
            if gh api --method DELETE               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"; then
              echo "Deleted deployed staging artifact $artifact_id"
            else
              echo "Warning: unable to delete deployed staging artifact $artifact_id" >&2
            fi
          fi

      - name: Clean up staging SSH material
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/staging-deploy-key" \
            "$RUNNER_TEMP/staging-known-hosts"
