name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: [self-hosted, Linux, X64, creators-ci]
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://creator:ci-only@127.0.0.1:3306/creator_platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check deployment shell syntax
        run: |
          bash -n infra/deploy/bootstrap-server.sh
          bash -n infra/deploy/install-control-plane.sh
          bash -n infra/deploy/creator-deploy
          bash -n infra/deploy/creator-ops
          bash -n infra/deploy/package-release.sh

      - name: Check formatting
        run: |
          if ! pnpm format:check; then
            echo "::group::Prettier formatting diff"
            pnpm exec prettier --write . >/dev/null
            git --no-pager diff --check || true
            git --no-pager diff -- .
            echo "::endgroup::"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

  test:
    name: test
    runs-on: [self-hosted, Linux, X64, creators-ci]
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: creator_platform
          MARIADB_USER: creator
          MARIADB_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s
          --health-retries=20
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
      DATABASE_URL: mysql://creator:ci-only@127.0.0.1:3306/creator_platform
      APP_ENV: staging
      APP_URL: http://localhost:3000
      APP_VERSION: ${{ github.sha }}
      SIGNUPS_ENABLED: "true"
      GENERATION_INTEGRATION_TEST: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify media tools on self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null
          command -v fc-match >/dev/null
          ffmpeg -version >/dev/null
          fc-match "Noto Sans" | grep -qi "Noto"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations for integration tests
        run: pnpm --filter @aiwa/db migrate:deploy

      - name: Test
        run: pnpm test

  build_release:
    name: build-release
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64, creators-ci]
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: creator_platform
          MARIADB_USER: creator
          MARIADB_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s
          --health-retries=20
    env:
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
      DATABASE_URL: mysql://creator:ci-only@127.0.0.1:3306/creator_platform
      APP_ENV: staging
      APP_URL: http://localhost:3000
      APP_VERSION: ${{ github.sha }}
      SIGNUPS_ENABLED: "true"
      GENERATION_INTEGRATION_TEST: "true"
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-1.1.x,debian-openssl-3.0.x
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations for build validation
        run: pnpm --filter @aiwa/db migrate:deploy

      - name: Build
        run: pnpm build

      - name: Smoke-test worker runtime
        run: |
          node -e "require('./apps/worker/dist/index.cjs'); setTimeout(() => process.exit(0), 250)"
          if node apps/worker/dist/byteplus-smoke.cjs >byteplus-smoke.log 2>&1; then
            echo "BytePlus smoke command unexpectedly ran without credentials" >&2
            exit 1
          fi
          grep -q '"status":"failed"' byteplus-smoke.log

      - name: Package and validate staging release
        run: |
          bash infra/deploy/package-release.sh "$GITHUB_SHA"
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          if command -v pigz >/dev/null 2>&1; then
            tar -I pigz -xf "creator-platform-${GITHUB_SHA}.tar.gz" -C "$validation_dir"
          else
            tar -xzf "creator-platform-${GITHUB_SHA}.tar.gz" -C "$validation_dir"
          fi
          test "$(cat "$validation_dir/RELEASE_LAYOUT")" = "3"
          (
            cd "$validation_dir"
            sha256sum --check --strict ops/control-plane.sha256
          )
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-web.service"
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-worker.service"
          grep -qx 'ProtectSystem=strict' "$validation_dir/ops/systemd/creator-worker@.service"
          test -n "$(find "$validation_dir/ops/db/node_modules" -path '*/@prisma/engines/libquery_engine-debian-openssl-3.0.x.so.node' -print -quit)"
          test -n "$(find "$validation_dir/ops/db/node_modules" -path '*/@prisma/engines/schema-engine-debian-openssl-3.0.x' -print -quit)"
          test -n "$(find "$validation_dir/ops/db/node_modules" -path '*/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node' -print -quit)"

      - name: Compute artifact checksum
        run: |
          sha256sum "creator-platform-${GITHUB_SHA}.tar.gz" > "creator-platform-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: creator-platform-${{ github.sha }}
          path: |
            creator-platform-${{ github.sha }}.tar.gz
            creator-platform-${{ github.sha }}.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  quality:
    name: quality
    if: always()
    needs: [static, test, build_release]
    runs-on: [self-hosted, Linux, X64, creators-ci]
    timeout-minutes: 2
    steps:
      - name: Require every CI lane to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build_release.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
