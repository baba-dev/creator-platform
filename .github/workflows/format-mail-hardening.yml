name: Canonical Format Mail Hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/transactional-mail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/transactional-mail
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm --filter @aiwa/db format:schema
      - name: Commit canonical formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-mail-hardening.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical mail hardening formatting"
          git push origin HEAD:feat/transactional-mail
